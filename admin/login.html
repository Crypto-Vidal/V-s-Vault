<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Dynasty labz CMS</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body">
    <!-- Background Animation -->
    <div class="holo-background">
        <div class="grid-overlay"></div>
        <div class="floating-particles"></div>
    </div>

    <div class="admin-login-container">
        <div class="holo-panel login-panel">
            <div class="panel-glow"></div>
            <div class="scan-line"></div>

            <div class="login-header">
                <div class="logo-text">Dynasty<span class="logo-accent"> labz</span></div>
                <h1>Content Management System</h1>
                <p>Admin Access Portal</p>
            </div>

            <div class="login-form">
                <button id="enterBtn" class="btn btn-primary btn-full" style="margin-top: 2rem;">
                    <span>Enter Dashboard</span>
                    <div class="btn-glow"></div>
                </button>
            </div>

            <div class="login-footer">
                <a href="../index.html" class="back-link">← Back to Website</a>
            </div>
        </div>
    </div>

    <script src="../js/main.js"></script>
    <script>
        // Simple redirect to dashboard
        document.getElementById('enterBtn').addEventListener('click', () => {
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
